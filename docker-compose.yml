services:

  backend:
    build: ./backend
    container_name: terralogic-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build: ./FRONTEND
    container_name: terralogic-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:17
    container_name: terralogic-db
    restart: always
    environment:
      POSTGRES_USER: terralogic
      POSTGRES_PASSWORD: terralogic123
      POSTGRES_DB: terralogic
    ports:
      - "5432:5432"
    # volumes:
    #   - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql


  nginx:
    image: nginx:latest
    container_name: terralogic-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend